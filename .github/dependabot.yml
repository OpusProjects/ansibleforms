version: 2

# Dependabot NEVER proposes a major version : every entry ignores semver-major updates.
# Majors carry breaking changes by definition, so they are done by hand (npm outdated,
# read the changelog, decide) and never arrive through a routine-looking pull request.
# Minor and patch updates are grouped into one pull request per entry per week.
#
# Every pull request title here must pass the PR / Title check (Conventional Commits), so
# each entry sets a commit-message prefix : build(deps) for what ships in the image, ci for
# the workflow actions. `build` is hidden in the generated CHANGELOG.

updates:
  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      client:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      server:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      actions:
        patterns: ['*']

  # Watches the digest pin on the base image in Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: build
      include: scope
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # The maintenance line (release/6.x) : patch updates only - a minor of a dependency is
  # no business of a patch release. Dependabot reads this file from main only, so the
  # entries for the other branch live here.
  - package-ecosystem: npm
    directory: /client
    target-branch: release/6.x
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
    groups:
      client-6x:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /server
    target-branch: release/6.x
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
    groups:
      server-6x:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    target-branch: release/6.x
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
