version: 2

# Dependabot NEVER proposes a major version : every entry ignores semver-major updates.
# Majors carry breaking changes by definition, so they are done by hand (npm outdated,
# read the changelog, decide) and never arrive through a routine-looking pull request.
# Updates are never grouped : every dependency gets its own pull request, so each one can be
# reviewed, tested and reverted on its own.
#
# Every pull request title here must pass the PR / Title check (Conventional Commits), so
# each entry sets a commit-message prefix : build(deps) for what ships in the image, ci for
# the workflow actions. `build` is hidden in the generated CHANGELOG.

updates:
  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # Moves the digest pins (the docker updater reads every file named *Dockerfile* in the
  # directory) : node:24-bookworm(-slim) in Dockerfile, the app, and node:24-trixie-slim in
  # Dockerfile.rte-base. Dockerfile.rte-runner and .rte-legacy build FROM our own layers (BASE_IMAGE).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: build
      include: scope
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # The python packages of the RTE images (docker/rte-runner for ansibleforms-rte-runner, docker/rte-legacy
  # for ansibleforms-rte-legacy) : pinned, so an image changes only with a commit here
  - package-ecosystem: pip
    directories:
      - /docker/rte-runner
      - /docker/rte-legacy
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # The maintenance line (release/6.x) : patch updates only - a minor of a dependency is
  # no business of a patch release. Dependabot reads this file from main only, so the
  # entries for the other branch live here.
  - package-ecosystem: npm
    directory: /client
    target-branch: release/6.x
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']

  - package-ecosystem: npm
    directory: /server
    target-branch: release/6.x
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']

  - package-ecosystem: docker
    directory: /
    target-branch: release/6.x
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
