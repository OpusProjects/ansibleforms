name: Release candidate

# Publishes a test image of a pull request, on demand :
#
#   Actions -> Release candidate -> Run workflow -> enter the pull request number
#
#   <next version>-rc.<pr number>.<run number>   e.g. 6.4.0-rc.512.7
#   latest-rc                                    always the most recent candidate
#
# A button rather than a label : a workflow listening for labels or pushes starts - and
# shows a skipped run - on EVERY label and push of EVERY pull request, Dependabot's included.
#
# The next version is the one this pull request would release. On the release pull
# request itself server/package.json already holds it (its tag does not exist yet) ;
# on any other pull request it is the last release, bumped by the type in the PR title.
#
# Only pull requests from a branch of THIS repository. A fork's code never runs with the
# Docker Hub secret.

on:
  workflow_dispatch:
    inputs:
      pr:
        description: 'Pull request number'
        type: number
        required: true

permissions:
  contents: read

concurrency:
  group: rc-${{ inputs.pr }}
  cancel-in-progress: true

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      rc: ${{ steps.v.outputs.rc }}
      sha: ${{ steps.pr.outputs.sha }}
      ghcr: ${{ steps.v.outputs.ghcr }}
    steps:
      - name: Read the pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ inputs.pr }}
        run: |
          pr=$(gh api "repos/${{ github.repository }}/pulls/$PR")
          if [ "$(jq -r .head.repo.full_name <<< "$pr")" != "${{ github.repository }}" ]; then
            echo "::error::#$PR comes from a fork - release candidates are built only from branches of this repository"
            exit 1
          fi
          if [ "$(jq -r .state <<< "$pr")" != "open" ]; then
            echo "::error::#$PR is not open"
            exit 1
          fi
          echo "sha=$(jq -r .head.sha <<< "$pr")" >> "$GITHUB_OUTPUT"
          {
            echo "title<<EOF"
            jq -r .title <<< "$pr"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.sha }}
          fetch-depth: 0

      - name: Work out the candidate version
        id: v
        env:
          TITLE: ${{ steps.pr.outputs.title }}
          PR: ${{ inputs.pr }}
          RUN: ${{ github.run_number }}
        run: |
          base=$(jq -r .version server/package.json)
          if ! git rev-parse -q --verify "refs/tags/$base" >/dev/null; then
            # not released yet : this is the release pull request, the bump is already in
            next="$base"
          else
            IFS=. read -r major minor patch <<< "$base"
            if [[ "$TITLE" =~ ^[a-z]+(\([^\)]*\))?!: ]] || [[ "$TITLE" == *"BREAKING"* ]]; then
              next="$((major + 1)).0.0"
            elif [[ "$TITLE" =~ ^feat(\([^\)]*\))?: ]]; then
              next="$major.$((minor + 1)).0"
            else
              next="$major.$minor.$((patch + 1))"
            fi
          fi
          rc="$next-rc.$PR.$RUN"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # GHCR rejects uppercase, and github.repository keeps the owner's case
          echo "ghcr=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "release candidate $rc (manifest $base)"

  publish:
    name: Publish
    needs: version
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish.yml
    with:
      version: ${{ needs.version.outputs.rc }}
      ref: ${{ needs.version.outputs.sha }}
      channel: rc
    secrets: inherit

  comment:
    name: Comment
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: marocchino/sticky-pull-request-comment@v3
        with:
          number: ${{ inputs.pr }}
          header: release-candidate
          message: |
            ### Release candidate `${{ needs.version.outputs.rc }}`

            ```
            docker pull ansibleguy/ansibleforms:${{ needs.version.outputs.rc }}
            docker pull ${{ needs.version.outputs.ghcr }}:${{ needs.version.outputs.rc }}
            ```

            Also tagged `latest-rc`. Built from ${{ needs.version.outputs.sha }}.
            Run the Release candidate workflow again to publish a newer candidate.
