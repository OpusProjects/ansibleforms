name: Docs

# A pull request BUILDS the site but does not deploy it. server/help.yaml is the
# single source of truth for the settings pages and is read by four tests, so a malformed
# edit used to be discovered only after the merge, when this workflow failed on main.
# The app owns that file; the site gets a copy in docs/_data at build time.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main", "release/**"]
    paths:
      - 'docs/**'
      - 'CHANGELOG.md'
      - 'server/help.yaml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # deploys keep the single "pages" group and are never cancelled ; each PR gets its own
  group: pages-${{ github.event.pull_request.number || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # reads as "Docs / Build" where the workflow name prefixes the job. Note that
    # renaming it breaks any branch protection rule that requires it
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      
      - name: Copy the settings help into docs
        run: mkdir -p docs/_data && cp server/help.yaml docs/_data/help.yaml

      - name: Copy changelog into docs
        run: |
          { echo '---'; echo 'layout: default'; echo 'title: Changelog'; echo 'nav_order: 10'; echo '---'; echo ''; cat CHANGELOG.md; } > docs/changelog.md

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          cache-version: 0
          working-directory: docs
      
      # skipped on a pull request : it calls the Pages API, and a fork's token cannot.
      # base_path is then empty, which jekyll reads as the site root - fine for a build
      # that is only ever thrown away.
      - name: Setup Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        working-directory: docs
        env:
          JEKYLL_ENV: production

      # The docs of the maintenance line, frozen under /v6/ : the site is built from main
      # (the next major), and 6.x users still need the pages that match their version.
      # Skipped until the branch exists, and on pull requests (only main deploys).
      - name: Check out the 6.x docs
        id: v6
        if: github.event_name != 'pull_request'
        run: |
          if git ls-remote --exit-code --heads origin release/6.x >/dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no release/6.x branch yet - no /v6/ docs"
          fi

      - uses: actions/checkout@v7
        if: steps.v6.outputs.present == 'true'
        with:
          ref: release/6.x
          path: v6

      - name: Build the 6.x docs
        if: steps.v6.outputs.present == 'true'
        run: |
          { echo '---'; echo 'layout: default'; echo 'title: Changelog'; echo 'nav_order: 10'; echo '---'; echo ''; cat ../v6/CHANGELOG.md; } > ../v6/docs/changelog.md
          bundle exec jekyll build --source ../v6/docs --destination _site/v6 --baseurl "${{ steps.pages.outputs.base_path }}/v6"
        working-directory: docs
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_site

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
