name: Docker

# Builds the two images (the app and the RTE) without pushing them, so "does the image still assemble" is answered at
# review time instead of by hand during publish.sh. Path-filtered because it is the slow
# one - it runs npm ci and a vite build inside the image - and for that reason it is not
# a check worth requiring in branch protection.

on:
  pull_request:
    branches: [main, 'release/**']
    paths:
      - 'Dockerfile'
      - 'Dockerfile.rte'
      - 'server/ansible.cfg'
      - 'server/healthcheck.js'
      - 'client/package.json'
      - 'client/package-lock.json'
      - 'server/package.json'
      - 'server/package-lock.json'
      - 'scripts/generate-build-info.sh'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          # Built to prove it builds, never published: say so, or buildx warns that the result
          # goes nowhere.
          outputs: type=cacheonly
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Build the RTE (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.rte
          push: false
          outputs: type=cacheonly
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=rte
          cache-to: type=gha,mode=max,scope=rte
