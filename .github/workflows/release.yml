name: Release

# release-please keeps ONE open pull request per release line, "chore: release x.y.z", up to
# date with every merge into that line : it computes the next version from the Conventional
# Commit titles of the squashed pull requests, bumps server/package.json and writes the
# CHANGELOG section. Merging that pull request is the release : this same workflow then
# creates the tag and the GitHub release, and publishes the image (see publish.yml for the
# tags).
#
# Two lines : main (the next major) and release/<major>.x (patches for the current one).
# Each branch has its own manifest and CHANGELOG ; the tags never collide (6.5.3, 7.0.1).
#
# The token comes from the GitHub App ansibleforms-release, not GITHUB_TOKEN. A pull request
# opened with GITHUB_TOKEN starts no workflows, so the release pull request would never get
# its required checks and could never be merged. See RELEASING.md for the App setup.
#
# A release also rebuilds ansibleforms.com : the site (ansibleforms/website) pulls
# CHANGELOG.md and server/help.yaml from here when it is built.

on:
  push:
    branches: [main, 'release/**']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      # RELEASE_APP_ID and RELEASE_APP_PRIVATE_KEY - see RELEASING.md
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: ${{ github.ref_name }}

      # A patch release on an older line would take GitHub's "Latest release" badge from the
      # newer major. Give it back to the highest final version.
      - name: Keep the Latest badge on the highest release
        if: steps.rp.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ steps.rp.outputs.tag_name }}
        run: |
          highest=$(gh api "repos/${{ github.repository }}/tags" --paginate --jq '.[].name' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ -n "$highest" ] && [ "$highest" != "$TAG" ]; then
            gh release edit "$highest" --repo "${{ github.repository }}" --latest
            echo "Latest stays on $highest (released $TAG)"
          fi

  publish:
    name: Publish
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish.yml
    with:
      version: ${{ needs.release-please.outputs.tag_name }}
      ref: ${{ needs.release-please.outputs.tag_name }}
      channel: release
    secrets: inherit

  # Tells ansibleforms/website to rebuild, so its changelog page shows this release.
  # GITHUB_TOKEN cannot start a workflow in another repository, so the token comes from the
  # same GitHub App as above, which is installed on ansibleforms/website too. It is asked for
  # that one repository only. Should this job fail, the site still catches up on its nightly
  # run - the release itself is already done.
  website:
    name: Rebuild the website
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: website

      - name: Send app-release to ansibleforms/website
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh api repos/ansibleforms/website/dispatches -f event_type=app-release -f "client_payload[tag]=$TAG"
          echo "ansibleforms/website rebuilds for $TAG"

  # Tells ansibleforms/helm-charts about the release, so the chart's default image follows
  # it: its "Follow app release" workflow opens a pull request on the chart line of this
  # major that moves the image, and merges it once the chart's CI passed. It waits for
  # publish because that CI installs the new image. The token comes from the same GitHub
  # App, asked for that one repository. Should this job fail, run "Follow app release" in
  # helm-charts by hand with the version.
  helm-charts:
    name: Tell the Helm chart
    needs: [release-please, publish]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: helm-charts

      - name: Send app-release to ansibleforms/helm-charts
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh api repos/ansibleforms/helm-charts/dispatches -f event_type=app-release -f "client_payload[tag]=$TAG"
          echo "ansibleforms/helm-charts follows $TAG"
