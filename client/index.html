<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- the server rewrites this base tag at runtime when BASE_URL is set (subpath hosting) -->
  <base href="/" />
  <link rel="icon" href="favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ansible Forms</title>
  <style>
    /* at least the window's height, and taller with its content : the header is sticky
       inside #app, so a fixed 100vh let it scroll away on a page taller than the window.
       The full height pages (af-fill-page : logs, designer) keep exactly the window, so
       their own pane is the one that scrolls. */
    #app{
      display:flex;
      flex-direction: column;
      min-height: 100vh;
    }
    #app:has(> .af-fill-page){
      height: 100vh;
    }
  </style>
  <script>
    // resolve the public login background images against the base tag, so they
    // follow the subpath the app is hosted under (relative urls in css custom
    // properties are unreliable across browsers, so we make them absolute here)
    (function () {
      var style = document.documentElement.style;
      ['light', 'dark', 'color'].forEach(function (theme) {
        style.setProperty('--af-login-background-' + theme,
          'url(' + new URL('img/login_background_' + theme + '.jpg', document.baseURI) + ')');
      });
    })();
  </script>
  <!-- served at runtime, not part of the build -->
  <link rel="stylesheet" href="css/themes.css" vite-ignore />
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
