<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- the server rewrites this base tag at runtime when BASE_URL is set (subpath hosting) -->
  <base href="/" />
  <link rel="icon" href="favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ansible Forms</title>
  <style>
    /* at least the window's height, and taller with its content : the header is sticky
       inside #app, so a fixed 100vh let it scroll away on a page taller than the window.
       The full height pages (af-fill-page : logs, designer) keep exactly the window, so
       their own pane is the one that scrolls. */
    #app{
      display:flex;
      flex-direction: column;
      min-height: 100vh;
    }
    #app:has(> .af-fill-page){
      height: 100vh;
    }
    /* a page with the header : the header stays at the top of the window and only #app,
       the box under it, scrolls - so the scrollbar starts below the header instead of
       running over it. The header is fixed, so it is not clipped or scrolled by #app.
       Pages without it (login, error) keep the window scrolling as before. */
    #app:has(> .af-header){
      position: fixed;
      inset: var(--af-header-offset) 0 0 0;
      min-height: 0;
      height: auto;
      overflow-y: auto;
    }
    /* it takes the focus for the keyboard scrolling (App.vue) : no focus ring for that */
    #app:focus{
      outline: none;
    }
    #app > .af-header{
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
    }
  </style>
  <!-- served at runtime, not part of the build ; a file, not inline, for the Content-Security-Policy -->
  <script src="js/login-backgrounds.js" vite-ignore></script>
  <!-- served at runtime, not part of the build -->
  <link rel="stylesheet" href="css/themes.css" vite-ignore />
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
