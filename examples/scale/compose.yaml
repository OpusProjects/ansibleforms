# AnsibleForms split over several containers : two app nodes behind nginx, one worker (and a
# second one waiting), one RTE, one database. A starting point - see README.md.
#
#   cp .env.example .env   # and fill in the secrets
#   docker compose up -d   # then https://localhost:8443
x-ansibleforms: &ansibleforms
  image: ghcr.io/ansibleforms/ansibleforms:7
  restart: unless-stopped
  depends_on: [db]
  env_file: .env
  volumes:
    # one volume for every app node and the worker : forms, repositories, uploads, backups
    - persistent:/app/dist/persistent
    # the ssh key and known_hosts for git over ssh, the same everywhere
    - ssh:/home/node/.ssh

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      # the user AnsibleForms connects with : all rights on its own schema, none elsewhere
      MARIADB_DATABASE: AnsibleForms
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql:/var/lib/mysql

  app1:
    <<: *ansibleforms
    environment: { AF_ROLE: app }
  app2:
    <<: *ansibleforms
    environment: { AF_ROLE: app }

  # the background work ; worker2 waits and takes over when worker1 stops
  worker1:
    <<: *ansibleforms
    environment: { AF_ROLE: worker }
  worker2:
    <<: *ansibleforms
    environment: { AF_ROLE: worker }

  # runs the playbooks : it adds itself under Connections > Runners as 'rte' (RTE_URL). ansible with
  # its collections ; ansibleforms-rte-core is the smaller one to build your own on (examples/rte)
  rte:
    image: ghcr.io/ansibleforms/ansibleforms-rte-full:7
    restart: unless-stopped
    depends_on: [db]
    env_file: .env
    environment: { HTTPS: "0", RTE_URL: "http://rte:8000" }
    volumes:
      - persistent:/app/dist/persistent
      - ssh:/home/node/.ssh

  lb:
    image: nginx:stable
    restart: unless-stopped
    depends_on: [app1, app2]
    ports: ["8443:443"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro

volumes:
  persistent:
  ssh:
  mysql:
