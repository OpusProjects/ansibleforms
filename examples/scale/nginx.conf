# ip_hash keeps a browser on one app node : the chat assistant keeps its conversations in the
# memory of the node that started them. Everything else works from any node.
upstream ansibleforms {
  ip_hash;
  server app1:8000;
  server app2:8000;
}
server {
  listen 443 ssl;
  ssl_certificate     /etc/nginx/certs/cert.pem;
  ssl_certificate_key /etc/nginx/certs/key.pem;
  client_max_body_size 0;
  location / {
    proxy_pass http://ansibleforms;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 300s;
  }
}
